[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wine-stats-lab"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.1,<3", "scipy>=1.11,<2", "matplotlib>=3.8,<4", "seaborn>=0.13,<1"]

[project.optional-dependencies]
dev = ["jupyterlab>=4,<5", "nbformat>=5.9,<6", "pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]
